rt":"14:00","end":"15:00"},{"title":"DLX | Seaboard Foods Priority Items Review","date":"2026-11-19","start":"11:30","end":"12:30"}]},"comms":{"pulledAt":"2026-11-17","emailSource":"Mail sent to seaboard@shipdlx.com with a Seaboard Foods representative on the chain (Outlook)","chatSource":"Seaboard Daily Operations (Microsoft Teams)","emails":[{"subject":"Seaboard - Route Guide and Auto Tender Capabilities","from":"Peter Callagy","org":"Seaboard Foods","at":"2026-11-17T16:07Z","msgs":[{"from":"Nolan DeBord","org":"DLX","at":"2026-11-11T22:11Z","text":"Hi Keifer,\n\nCan you or someone from the support team setup some time with Peter for an overview on Route Guide and Auto Tendering capabilities in 3GTMS? An intro call/overview might be helpful."},{"from":"Keifer George","org":"DLX","at":"2026-11-17T15:45Z","text":"Good morning Nolan,\n\nYes, let me gather some resources and we can shoot for a call towards the end of this week."},{"from":"Peter Callagy","org":"Seaboard Foods","at":"2026-11-17T16:07Z","text":"@Porter, Dustin for visibility."}]},{"subject":"Process for Origin Change Orders","from":"Nolan DeBord","org":"DLX","at":"2026-11-17T15:39Z","msgs":[{"from":"Jeff Armstrong","org":"Seaboard Foods","at":"2026-11-17T13:13Z","text":"Good morning, DLX Team -\n\nWe need a way to systematically process origin change orders. Currently, when there is an origin change on a load, we go through the cancellation process and Unplan the Load. This pushes the Order back to an Unscheduled status, checks the 'Needs Review' box, and when the origin change occurs, the Order turns orange. Since there are different groups/people who are cancelling loads vs those watching Orders and the timing of the changes can be an hour or more, so it is easy for someone to get sidetracked when watching for a change.\n\nCan we work on a way to have the system re-tie Loads to these Orders after they change origins? I am open to other processes to automate this too."},{"from":"Nolan DeBord","org":"DLX","at":"2026-11-17T15:17Z","text":"Hi Jeff,\n\nLets setup some time to review this. What does your availability look like the rest of today and tomorrow?"},{"from":"Jeff Armstrong","org":"Seaboard Foods","at":"2026-11-17T15:20Z","text":"Thanks Nolan -\n\nI'm available today except for the following times:\n11:30 - 12:30\n14:00 - 15:00\n\nTomorrow I'm available except for the following:\n14:00 - 16:00\n\nOther than those times, I'm free."},{"from":"Chuck Connor","org":"DLX","at":"2026-11-17T15:23Z","text":"I can throw something on the calendar for 11:00 – 11:30 this morning, leading into our touchpoint at 11:30. Let me know your thoughts @Nolan DeBord."},{"from":"Nolan DeBord","org":"DLX","at":"2026-11-17T15:38Z","text":"We will want Keifer on the call. If he is available we can do the 11am slot."}]},{"subject":"User - Hill Meat Co. HLMA","from":"Peter Callagy","org":"Seaboard Foods","at":"2026-11-16T17:41Z","msgs":[{"from":"Peter Callagy","org":"Seaboard Foods","at":"2026-11-16T17:40Z","text":"Good morning,\n\nPlease create a user login for Hill Meat Co. HLMA.\n\nThank you,"}]},{"subject":"[#358932] - PROD - SBT - SBDN - 204 - Seaboard / 3GTMS - RE: ST Joe to Edgerton","from":"Natalie Erdman","org":"Seaboard Foods","at":"2026-11-16T17:28Z","msgs":[{"from":"Natalie Erdman","org":"Seaboard Foods","at":"2026-11-16T17:11Z","text":"Good morning,\n\nThese are still not processing correctly same error and showing chilled instead of Frozen with no temperature"},{"from":"Colin Munsell-Carrier","org":"Intelek Technologies","at":"2026-11-16T17:16Z","text":"Natalie, please provide an example at your earliest convenience. thank you!"},{"from":"Dustin Porter","org":"Seaboard Foods","at":"2026-11-16T17:26Z","text":"Natalie – can you provide a couple load ID's as well."},{"from":"Natalie Erdman","org":"Seaboard Foods","at":"2026-11-16T17:27Z","text":"Then once you click on that it goes to the screen and shows chilled not frozen with no temp range"},{"from":"Natalie Erdman","org":"S -11-16T12:43Z","text":"Good OTD"}]},{"subject":"FourKites + Seaboard Foods Weekly Status | 11.13.26 | 3G TMS Migration | Project Code - 02975027","from":"Riya Naskar","org":"FourKites","at":"2026-11-13T21:31Z","msgs":[{"from":"Riya Naskar","org":"FourKites","at":"2026-11-13T21:30Z","text":"Hi Seaboard Foods team,\n\nPlease see below for this week's project status update.\n\nKey Highlights/Updates from last week include:\n• Held an internal transition review between the implementation team and the incoming Customer Success Manager (CSM), Indhumathi Kumaresan, ahead of account handover\n• Hypercare continues with no integration issues reported; load validation and carrier connectivity reports remain clean\n• Tracking quality remains strong for already-onboarded carriers\n• New carrier onboarding is out of scope for this implementation; Seaboard to decide internally on a network analyst resource for that work going forward\n• One open item remains: exit survey sign-off from Jeff Armstrong is still pending\n• An external transition call with Seaboard will be arranged to formally introduce the CSM and complete the handover\n\nLet me know if there are any questions."}],"note":"The status tables and project plan link in the original email are not shown."},{"subject":"EJ Logistics | DLX | Seaboard","from":"Robert Mejia","org":"External","at":"2026-11-13T15:50Z","msgs":[{"from":"Robert Mejia","org":"External","at":"2026-11-11T15:55Z","text":"Hi Amy and Marcus,\n\nThanks for sending over the accessorial codes! We're happy to update the 210s to help speed up approval. To make sure we map them correctly, could you help us…","p":1},{"from":"Marcus Winslow","org":"DLX","at":"2026-11-11T20:39Z","text":"1. Where should the codes go in the 210? For example, in the L1 charge line (L108) for each accessorial? Yes, please\n2. How should we match each charge from PCS to its code? If you…","p":1},{"from":"Robert Mejia","org":"External","at":"2026-11-11T21:46Z","text":"Hi Marcus,\n\nThank <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --navy:#002144; --blue:#39b6e6; --gray:#616265; --green:#81bc00; --red:#c9282d; --orange:#d97a23;
  --ink:#000000; --bg:#ffffff;
  --line:rgba(97,98,101,.28); --tint:rgba(0,33,68,.045);
  --font:Montserrat,Arial,"Liberation Sans",Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100%}
a{color:var(--navy);text-decoration-color:var(--blue);text-underline-offset:2px}
a:hover{color:#00305f}
button,select{font-family:inherit;font-size:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:0 clamp(12px,3vw,32px)}

/* Header */
.hdr{border-bottom:3px solid var(--navy);background:var(--bg)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px 32px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px}
.hdr img.dlx{height:44px;width:auto;display:block}
.client{display:flex;align-items:center;gap:16px;flex:1 1 auto;justify-content:center;min-width:240px}
.client img.sf{height:60px;width:auto;display:block}
.client .nm{font-size:1.15rem;color:var(--navy)}
.client .nm .lbl{color:var(--gray);font-weight:500}
.client .nm b{font-weight:700}
.health{display:flex;align-items:center;gap:10px}
.health label{font-weight:600;color:var(--navy);white-space:nowrap}
.health select{border:2px solid var(--navy);border-radius:8px;padding:7px 30px 7px 12px;background:#fff;color:var(--navy);font-weight:600;cursor:pointer}
.health .dot{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none}
.health .dot.on{background:var(--green)} .health .dot.risk{background:var(--orange)} .health .dot.off{background:var(--red)}

/* Tabs + toolbar */
.tabs{display:flex;gap:6px;margin-top:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{appearance:none;border:0;background:none;padding:12px 18px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}
.tab .n{font-weight:500;color:var(--gray);margin-left:6px;font-size:.85em}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:18px 0 8px}
.seg{display:inline-flex;border:2px solid var(--navy);border-radius:9px;overflow:hidden}
.seg button{appearance:none;border:0;background:#fff;color:var(--navy);padding:8px 14px;font-weight:600;cursor:pointer;border-right:1px solid var(--navy)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg .c{font-weight:500;opacity:.8;margin-left:5px}
.fl{display:flex;align-items:center;gap:8px;color:var(--gray);font-weight:600;font-size:.85rem}
.fl select{border:1px solid var(--gray);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);max-width:240px}
.btn{appearance:none;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--navy);color:#fff}
.btn.primary:hover{background:#00305f}
.spacer{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chipbtn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px 4px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:.82rem;color:var(--navy)}
.chipbtn[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.chipbtn .sw{width:10px;height:10px;border-radius:50%}
.chipbtn .ct{font-weight:500;color:var(--gray)}

/* TMS Implementation menu + subtabs */
.tabwrap{position:relative}
.tab .caret{font-size:.75em;margin-left:4px}
.menu{display:none;position:absolute;left:0;top:100%;z-index:20;min-width:290px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:0 0 10px 10px;box-shadow:0 8px 24px rgba(0,33,68,.18);padding:6px;margin-top:-1px}
.tabwrap.open .menu{display:block}
@media (hover:hover){.tabwrap:hover .menu{display:block}}
.menu button{appearance:none;border:0;background:none;width:100%;text-align:left;padding:10px 12px;border-radius:7px;font-weight:600;color:var(--navy);cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.menu button:hover{background:var(--tint)}
.menu button.cur{background:rgba(57,182,230,.16)}
.menu .n,.stab .n{font-weight:500;color:var(--gray);font-size:.85em}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.subtabs:empty{display:none}
.stab{appearance:none;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer}
.stab .n{margin-left:8px}
.stab[aria-pressed="true"]{background:var(--navy);color:#fff}
.stab[aria-pressed="true"] .n{color:rgba(255,255,255,.8)}

/* Home */
.snap{border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:6px 18px 18px;margin-top:22px;background:#fff}
.snaphead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px}
.home h1{margin:14px 0 4px;font-size:1.3rem;color:var(--navy)}
.home .lead{margin:0;color:var(--gray);font-size:1rem}
.home .lead b{color:var(--navy)}
.pbar{display:flex;gap:4px;height:12px;margin:8px 0 12px}
.pbar span{flex:1 1 0;border-radius:4px}
.sumrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.sumrow .pill b{font-weight:700}
.scrollnote{margin-left:auto;color:var(--gray);font-size:.8rem;font-style:italic}
.snapwrap{position:relative;border-top:1px solid var(--line)}
.snapwin{height:300px;overflow-y:auto;padding:12px 6px 44px 0;overscroll-behavior:contain}
.snapwin:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.snapwrap::after{content:"";position:absolute;left:0;right:12px;bottom:0;height:56px;background:linear-gradient(rgba(255,255,255,0),#fff 85%);pointer-events:none}
.snapwrap .hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:1;background:var(--navy);color:#fff;font-size:.75rem;font-weight:600;padding:3px 12px;border-radius:999px;pointer-events:none}
.snapwrap.end::after,.snapwrap.end .hint{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.card{appearance:none;text-align:left;background:#fff;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;cursor:pointer;font:inherit;color:inherit}
.card:hover{box-shadow:0 3px 12px rgba(0,33,68,.14);border-left-color:var(--blue)}
.card .ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card .cn{font-weight:700;color:var(--navy);font-size:.95rem}
.card .cl{color:var(--gray);font-size:.8rem}
.card .cl b{color:var(--navy)}
.card .go{color:var(--navy);font-weight:600;font-size:.78rem}

/* Meetings */
.meet{border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:12px;padding:6px 18px 18px;margin-top:18px;background:#fff}
.meet h2{margin:14px 0 4px;font-size:1.3rem;color:var(--navy)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}
.day{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;min-width:0}
.day.today{border-color:var(--blue);box-shadow:0 0 0 2px rgba(57,182,230,.35)}
.dh{font-weight:600;color:var(--navy);padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line);font-size:.9rem}
.dh .dw{font-weight:700}
.tdy{background:var(--blue);color:var(--navy);border-radius:999px;font-size:.68rem;font-weight:700;padding:1px 8px;margin-left:4px;vertical-align:1px}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mt{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--navy);padding-left:9px}
.mt.past{opacity:.55;border-left-color:var(--gray)}
.mtime{font-size:.78rem;font-weight:600;color:var(--gray)}
.mtitle{font-size:.88rem;color:var(--navy);font-weight:600;overflow-wrap:anywhere}
.nomt{margin:0;color:var(--gray);font-style:italic;font-size:.82rem}
@media (max-width:1100px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.days{grid-template-columns:1fr}}

/* Project Communication */
.comms{border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:6px 18px 18px;margin-top:18px;background:#fff}
.comms h2{margin:14px 0 4px;font-size:1.3rem;color:var(--navy)}
.ctabs{display:flex;gap:6px;margin:10px 0 0;border-bottom:1px solid var(--line)}
.ctab{appearance:none;border:0;background:none;padding:9px 16px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.ctab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}
.ctabs{margin-bottom:10px}
.comms .snapwrap{border-top:0}
.cwin{height:300px;padding-top:4px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{padding:11px 4px;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.msg{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center}
.mb{min-width:0}
.mh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--navy);font-size:.88rem}
.mw{color:var(--gray);font-size:.78rem}
.mx{margin-top:3px;font-size:.9rem;overflow-wrap:anywhere}
.ms{font-weight:700;color:var(--navy);overflow-wrap:anywhere;margin-bottom:3px}
.org{border-radius:999px;padding:1px 9px;font-size:.7rem;font-weight:700;background:rgba(97,98,101,.14);color:var(--navy)}
.org.dlx{background:rgba(0,33,68,.10)}
.org.sf{background:rgba(57,182,230,.22)}

/* Email chain */
.feed li.mail{padding:0}
.mrow{appearance:none;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:11px 4px;display:flex;align-items:flex-start;gap:10px}
.mrow:hover{background:var(--tint)}
.mcar{color:var(--blue);display:inline-block;transition:transform .15s;margin-top:2px}
.mrow[aria-expanded="true"] .mcar{transform:rotate(90deg)}
.mmain{flex:1 1 auto;min-width:0;display:block}
.mmain .ms{display:block}
.mmain .mh{display:flex}
.mcount{flex:none;color:var(--gray);font-size:.78rem;font-weight:600;white-space:nowrap;padding-top:2px}
.chain{margin:0 4px 12px 24px;border-left:3px solid var(--blue);padding-left:14px;display:flex;flex-direction:column;gap:12px}
.cm .ct{margin-top:3px;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.prev{border:1px solid var(--gray);border-radius:999px;padding:0 8px;font-size:.68rem;font-weight:700;color:var(--gray)}
.cnote{margin:0;color:var(--gray);font-size:.8rem;font-style:italic}

/* Table */
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
thead th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;text-align:left;font-weight:600;font-size:.8rem;letter-spacing:.02em;padding:0}
thead th button{appearance:none;border:0;background:none;color:inherit;font:inherit;padding:11px 12px;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px}
thead th .arr{opacity:.9;font-size:.7rem}
thead th.nosort{padding:11px 12px}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
tbody tr.row:hover td{background:var(--tint)}
tr.sub td.title{padding-left:34px}
tr.sub td.title .tt{font-weight:500}
td.title .tt{font-weight:600;color:var(--navy)}
td.title .arrow{color:var(--blue);margin-right:6px;font-weight:700}
tr.ctx td{opacity:.55}
.np{color:var(--gray);font-style:italic}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px 3px 9px;border-radius:999px;font-weight:600;font-size:.78rem;background:var(--tint);color:var(--navy);white-space:nowrap}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--gray));flex:none}
tr.phase td{background:var(--tint);border-bottom:2px solid var(--navy);padding:0}
.phtoggle{appearance:none;border:0;background:none;width:100%;text-align:left;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;color:var(--navy);font-size:.98rem}
.phtoggle .car{display:inline-block;transition:transform .15s;color:var(--blue)}
.phtoggle[aria-expanded="true"] .car{transform:rotate(90deg)}
.phtoggle .cnt{font-weight:500;color:var(--gray);font-size:.82rem}
.empty{padding:40px 12px;text-align:center;color:var(--gray)}
.ftr{margin:28px 0 36px;padding-top:14px;border-top:1px solid var(--line);color:var(--gray);font-size:.8rem;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}

/* Refresh panel */
.ov{position:fixed;inset:0;background:rgba(0,33,68,.55);display:none;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;z-index:50}
.ov.open{display:flex}
.dlg{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:22px 24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 4px;color:var(--navy);font-size:1.15rem}
.dlg p{margin:6px 0;color:var(--gray)}
.dlg .stp{margin:16px 0 0;font-weight:700;color:var(--navy)}
.dlg textarea{width:100%;min-height:120px;border:1px solid var(--gray);border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.dlg .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.msg{font-size:.85rem;color:var(--navy);margin-top:6px;min-height:1.2em}
.msg.err{color:var(--red)}
.kbd{display:inline-block;border:1px solid var(--gray);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-weight:700;color:var(--navy);background:#fff}

/* Mobile cards */
@media (max-width:900px){
  .hdr .wrap{justify-content:center}
  .client{justify-content:center;order:3;flex-basis:100%}
  table,tbody,tr,td{display:block}
  table{table-layout:auto}
  thead{display:none}
  tr.row{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:8px 12px;background:#fff}
  tr.sub{margin-left:16px;border-left:4px solid var(--blue)}
  td{border:0;padding:5px 0;display:flex;gap:12px}
  td::before{content:attr(data-label);flex:0 0 8.2rem;font-weight:600;color:var(--gray);font-size:.7rem;text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
  td.title{display:block;padding-bottom:6px}
  td.title::before{display:none}
  tr.sub td.title{padding-left:0}
  tbody tr.row:hover td{background:none}
  tr.phase{margin-top:18px}
  tr.phase td{display:block;border-bottom:2px solid var(--navy)}
  tr.phase td::before{display:none}
  .fl select{max-width:100%}
}
@media (max-width:900px){.snapwin{height:320px}.scrollnote{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){.phtoggle .car{transition:none}}

var REFRESH_REQUEST = 'Refresh the Seaboard client portal from Wrike (Seaboard folder 4350217890: Implementation Schedule + Launch Log) the Seaboard meetings scheduled this week from my Outlook calendar, the latest email threads (only threads that include seaboard@shipdlx.com AND at least one Seaboard Foods representative at seaboardfoods.com on the chain), and the latest Seaboard Daily Operations Teams chat messages, using the same rules as before, and give me the full updated file.';
var coll = new Intl.Collator('en',{numeric:true,sensitivity:'base'});

var DATA, model;
var state = {mailOpen:{},ctab:'teams',tab:'home',mode:'open',status:'',assignee:'',sort:{key:'title',dir:1},expanded:{}};  /* Project Schedule starts with every phase collapsed */

/* ---------- Helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clean(s){return String(s||'').replace(/\s+/g,' ').trim();}
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function flat(rows){var out=[];rows.forEach(function(r){out.push(r);out=out.concat(flat(r.children));});return out;}
var timeFmt;
try{timeFmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});}catch(e){timeFmt=null;}
function fmtTime(iso){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d)) return iso;
  return timeFmt?timeFmt.format(d):d.toUTCString();
}
function fmtDay(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); if(!m) return s||'';
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

/* ---------- Model ---------- */
function buildModel(d){
  function names(codes){return (codes||[]).map(function(c){return d.people[c]||c;});}
  function tk(t){
    if(!t) return null;
    if(typeof t==='string') return {text:t,url:''};
    return {text:t[0],url:/^https?:\/\//i.test(t[1]||'')?t[1]:''};
  }
  function launch(rows){return (rows||[]).map(function(r){return {
    title:r[0],status:r[1],assignees:names(r[2]),external:r[3]||[],ticket:tk(r[4]),update:r[5]||'',time:r[6]||'',children:launch(r[7])};});}
  function impl(rows){return (rows||[]).map(function(r){return {
    title:r[0],status:r[1],assignees:names(r[2]),children:impl(r[3])};});}
  return {
    launch:launch(d.launch),
    impl:d.impl.map(function(p){return {name:p.phase,status:p.status||'',tasks:impl(p.tasks)};})
  };
}

/* ---------- Filtering & sorting ---------- */
function modeOK(r){
  if(state.tab!=='launch'||state.mode==='all') return true;
  return state.mode==='open'?!!OPEN[r.status]:!!RESOLVED[r.status];
}
function pred(r){
  if(!modeOK(r)) return false;
  if(state.status && r.status!==state.status) return false;
  if(state.assignee){
    var kind=state.assignee.charAt(0), nm=state.assignee.slice(2);
    var list=kind==='x'?(r.external||[]):r.assignees;
    if(list.indexOf(nm)<0) return false;
  }
  return true;
}
function filterTree(rows){
  var out=[];
  rows.forEach(function(r){
    var kids=filterTree(r.children), self=pred(r);
    if(self||kids.length) out.push({row:r,kids:kids,ctx:!self});
  });
  return out;
}
function sortVal(r,k){
  if(k==='title') return clean(r.title);
  if(k==='status') return r.status;
  if(k==='assignee') return r.assignees.join(', ');
  if(k==='external') return (r.external||[]).join(', ');
  if(k==='time') return r.time||'';
  return '';
}
function cmp(a,b){
  var k=state.sort.key, dir=state.sort.dir, ra=a.row, rb=b.row;
  var va=sortVal(ra,k), vb=sortVal(rb,k), ea=va==='', eb=vb==='';
  if(ea!==eb) return ea?1:-1;
  var c;
  if(k==='status') c=STATUS[ra.status].order-STATUS[rb.status].order;
  else if(k==='time') c=va<vb?-1:va>vb?1:0;
  else c=coll.compare(va,vb);
  if(c) return c*dir;
  return coll.compare(clean(ra.title),clean(rb.title));
}
function sortTree(nodes){
  nodes.sort(cmp);
  nodes.forEach(function(n){sortTree(n.kids);});
  return nodes;
}

/* ---------- Rendering ---------- */
function pill(code){
  var s=STATUS[code]||{label:code,color:'#616265'};
  return '<span class="pill" style="--c:'+s.color+';background:'+rgba(s.color,.16)+'">'+esc(s.label)+'</span>';
}
function textOr(v){return v?esc(v):'<span class="np">'+NP+'</span>';}
function cols(){
  if(state.tab==='launch') return [
    {k:'title',h:'Task',w:'24%',sort:1},{k:'status',h:'Status',w:'11%',sort:1},{k:'assignee',h:'Assignee',w:'11%',sort:1},
    {k:'external',h:'External Assignee',w:'13%',sort:1},{k:'ticket',h:'Ticket #',w:'8%'},
    {k:'update',h:'Latest Update',w:'23%'},{k:'time',h:'Update Time',w:'10%',sort:1}];
  return [{k:'title',h:'Task',w:'56%',sort:1},{k:'status',h:'Status',w:'18%',sort:1},{k:'assignee',h:'Assignee',w:'26%',sort:1}];
}
function cell(c,r,depth){
  var lab=' data-label="'+esc(c.h)+'"';
  switch(c.k){
    case 'title': return '<td class="title"'+lab+'>'+(depth?'<span class="arrow" aria-hidden="true">&#8627;</span>':'')+'<span class="tt">'+esc(clean(r.title))+'</span></td>';
    case 'status': return '<td'+lab+'>'+pill(r.status)+'</td>';
    case 'assignee': return '<td'+lab+'>'+textOr(r.assignees.join(', '))+'</td>';
    case 'external': return '<td'+lab+'>'+textOr((r.external||[]).join(', '))+'</td>';
    case 'ticket':
      if(!r.ticket) return '<td'+lab+'><span class="np">'+NP+'</span></td>';
      return '<td'+lab+'>'+(r.ticket.url?'<a href="'+esc(r.ticket.url)+'" target="_blank" rel="noopener noreferrer">'+esc(r.ticket.text)+'</a>':esc(r.ticket.text))+'</td>';
    case 'update': return '<td'+lab+'>'+textOr(r.update)+'</td>';
    case 'time': return '<td'+lab+'>'+textOr(fmtTime(r.time))+'</td>';
  }
  return '<td></td>';
}
function rowsHtml(nodes,depth,cs){
  var h='';
  nodes.forEach(function(n){
    h+='<tr class="row'+(depth?' sub':'')+(n.ctx?' ctx':'')+'">'+cs.map(function(c){return cell(c,n.row,depth);}).join('')+'</tr>';
    h+=rowsHtml(n.kids,depth+1,cs);
  });
  return h;
}
function theadHtml(cs){
  return '<thead><tr>'+cs.map(function(c){
    if(!c.sort) return '<th class="nosort" style="width:'+c.w+'">'+esc(c.h)+'</th>';
    var on=state.sort.key===c.k, arr=on?(state.sort.dir>0?'&#9650;':'&#9660;'):'';
    return '<th style="width:'+c.w+'" aria-sort="'+(on?(state.sort.dir>0?'ascending':'descending'):'none')+'"><button type="button" data-sort="'+c.k+'">'+esc(c.h)+' <span class="arr">'+arr+'</span></button></th>';
  }).join('')+'</tr></thead>';
}
function viewRows(){return state.tab==='launch'?model.launch:model.impl.reduce(function(a,p){return a.concat(p.tasks);},[]);}
function allFlat(){return flat(viewRows());}

function renderTable(){
  var cs=cols(), h='', visible=0;
  if(state.tab==='launch'){
    var nodes=sortTree(filterTree(model.launch));
    visible=flat(nodes.map(function(n){return n.row;})).length;
    h=rowsHtml(nodes,0,cs);
  }else{
    var phases=model.impl.slice().sort(function(a,b){return coll.compare(clean(a.name),clean(b.name));});
    phases.forEach(function(p,i){
      var nodes=sortTree(filterTree(p.tasks));
      if(!nodes.length) return;
      var n=0;(function count(ns){ns.forEach(function(x){if(!x.ctx)n++;count(x.kids);});})(nodes);
      visible+=n;
      var open=!!state.expanded[p.name]||!!(state.status||state.assignee);  /* active filters open phases so matches are visible */
      h+='<tr class="phase"><td colspan="'+cs.length+'"><button type="button" class="phtoggle" data-phase="'+i+'" aria-expanded="'+open+'"><span class="car" aria-hidden="true">&#9656;</span>'+esc(clean(p.name))+' <span class="cnt">'+n+' item'+(n===1?'':'s')+'</span></button></td></tr>';
      if(open) h+=rowsHtml(nodes,0,cs);
    });
    state._phases=phases;
  }
  $('tableHost').innerHTML=visible?('<table>'+theadHtml(cs)+'<tbody>'+h+'</tbody></table>'):'<div class="empty">No items match the current filters.</div>';
}

function statusesPresent(){
  var seen={};
  allFlat().forEach(function(r){
    if(state.tab==='launch'&&state.mode!=='all'&&!(state.mode==='open'?OPEN[r.status]:RESOLVED[r.status])) return;
    seen[r.status]=(seen[r.status]||0)+1;
  });
  return Object.keys(seen).sort(function(a,b){return STATUS[a].order-STATUS[b].order;}).map(function(k){return {code:k,n:seen[k]};});
}
function renderToolbar(){
  var rows=allFlat(), h='';
  if(state.tab==='launch'){
    var o=rows.filter(function(r){return OPEN[r.status];}).length, rs=rows.filter(function(r){return RESOLVED[r.status];}).length;
    h+='<div class="seg" role="group" aria-label="Item filter">'+
      '<button type="button" data-mode="open" aria-pressed="'+(state.mode==='open')+'">Open items<span class="c">'+o+'</span></button>'+
      '<button type="button" data-mode="resolved" aria-pressed="'+(state.mode==='resolved')+'">Resolved items<span class="c">'+rs+'</span></button>'+
      '<button type="button" data-mode="all" aria-pressed="'+(state.mode==='all')+'">All items<span class="c">'+rows.length+'</span></button></div>';
  }else{
    var anyCollapsed=!(state.status||state.assignee)&&sortedPhases().some(function(p){return !state.expanded[p.name];});
    h+='<button type="button" class="btn" data-act="'+(anyCollapsed?'expand':'collapse')+'">'+(anyCollapsed?'Expand all phases':'Collapse all phases')+'</button>';
  }
  var sts=statusesPresent();
  h+='<label class="fl">Status <select id="fStatus"><option value="">All statuses</option>'+sts.map(function(s){return '<option value="'+s.code+'"'+(state.status===s.code?' selected':'')+'>'+esc(STATUS[s.code].label)+'</option>';}).join('')+'</select></label>';
  var nat={},ext={};
  rows.forEach(function(r){r.assignees.forEach(function(n){nat[n]=1;});(r.external||[]).forEach(function(n){ext[n]=1;});});
  function opts(map,kind){return Object.keys(map).sort(coll.compare).map(function(n){var v=kind+'|'+n;return '<option value="'+esc(v)+'"'+(state.assignee===v?' selected':'')+'>'+esc(n)+'</option>';}).join('');}
  h+='<label class="fl">Assignee <select id="fAssignee"><option value="">Everyone</option>';
  if(state.tab==='launch'){
    h+='<optgroup label="Assignee">'+opts(nat,'n')+'</optgroup><optgroup label="External Assignee">'+opts(ext,'x')+'</optgroup>';
  }else h+=opts(nat,'n');
  h+='</select></label>';
  h+='<span class="spacer"></span>';
  $('toolbar').innerHTML=h;
  // status chips (counts for the current view, before status/assignee filters)
  $('chips').innerHTML=sts.map(function(s){
    var c=STATUS[s.code].color;
    return '<button type="button" class="chipbtn" data-chip="'+s.code+'" aria-pressed="'+(state.status===s.code)+'"><span class="sw" style="background:'+c+'"></span>'+esc(STATUS[s.code].label)+' <span class="ct">'+s.n+'</span></button>';
  }).join('');
}
function viewCounts(){
  return {launch:flat(model.launch).length,
          schedule:flat(model.impl.reduce(function(a,p){return a.concat(p.tasks);},[])).length};
}
var VIEWS=[{k:'schedule',label:'Project Schedule'},{k:'launch',label:'Post-Launch Priority Items'}];
function renderTabs(){
  var n=viewCounts(), inTms=state.tab!=='home';
  $('tabs').innerHTML=
    '<button type="button" class="tab" role="tab" data-tab="home" aria-selected="'+(state.tab==='home')+'">Home</button>'+
    '<div class="tabwrap'+(state.menu?' open':'')+'">'+
      '<button type="button" class="tab" role="tab" data-menu="1" aria-haspopup="true" aria-expanded="'+!!state.menu+'" aria-selected="'+inTms+'">TMS Implementation <span class="caret" aria-hidden="true">&#9662;</span></button>'+
      '<div class="menu" role="menu">'+VIEWS.map(function(v){
        return '<button type="button" role="menuitem" data-view="'+v.k+'"'+(state.tab===v.k?' class="cur"':'')+'>'+v.label+' <span class="n">'+n[v.k]+'</span></button>';}).join('')+'</div>'+
    '</div>';
  $('subtabs').innerHTML=inTms?VIEWS.map(function(v){
    return '<button type="button" class="stab" data-view="'+v.k+'" aria-pressed="'+(state.tab===v.k)+'">'+v.label+'<span class="n">'+n[v.k]+'</span></button>';}).join(''):'';
}
function renderFooter(){
  $('footer').innerHTML='<span>Source: Wrike, DLX calendar, Outlook and Teams &middot; Data pulled '+esc(fmtDay(DATA.meta.pulledAt))+'</span>'+
    '<span>Update times shown in Central Time.</span>'+
    '<span class="spacer"></span><button type="button" class="btn" data-act="refresh">Refresh data <span class="kbd">R</span></button>';
}
function sortedPhases(){return model.impl.slice().sort(function(a,b){return coll.compare(clean(a.name),clean(b.name));});}
function hm12(t){var m=/^(\d{1,2}):(\d{2})/.exec(t||'');if(!m) return t||'';var h=+m[1],ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+m[2]+' '+ap;}
function meetingsHtml(){
  var M=DATA.meetings; if(!M||!M.weekOf||!Array.isArray(M.items)) return '';
  var p=/^(\d{4})-(\d{2})-(\d{2})/.exec(M.weekOf); if(!p) return '';
  var base=new Date(+p[1],+p[2]-1,+p[3]), today='', nowT='';
  try{
    today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date());
    nowT=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Chicago',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
  }catch(e){}
  function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  var end=new Date(base.getFullYear(),base.getMonth(),base.getDate()+4);
  var range=base.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' – '+end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  var cols='', total=0;
  for(var i=0;i<5;i++){
    var d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+i), k=iso(d);
    var items=M.items.filter(function(x){return x.date===k;}).sort(function(a,b){return (a.start||'')<(b.start||'')?-1:1;});
    total+=items.length;
    cols+='<div class="day'+(k===today?' today':'')+'"><div class="dh"><span class="dw">'+d.toLocaleDateString('en-US',{weekday:'short'})+'</span> '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(k===today?' <span class="tdy">Today</span>':'')+'</div>'+
      (items.length?'<ul>'+items.map(function(x){
        var past=(k<today)||(k===today&&nowT&&(x.end||'')<=nowT);
        return '<li class="mt'+(past?' past':'')+'"><span class="mtime">'+esc(hm12(x.start))+' – '+esc(hm12(x.end))+' CT</span><span class="mtitle">'+esc(x.title)+'</span></li>';}).join('')+'</ul>'
      :'<p class="nomt">No meetings scheduled</p>')+'</div>';
  }
  return '<section class="meet"><div class="snaphead"><h2>This Week&rsquo;s Meetings</h2><p class="lead">Week of '+esc(base.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}))+'</p></div><div class="days">'+cols+'</div></section>';
}
function shortTime(iso){
  var d=new Date(iso); if(isNaN(d)) return iso||'';
  try{return new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(d);}catch(e){return d.toUTCString();}
}
function orgTag(o){
  var c=o==='DLX'?'dlx':o==='Seaboard Foods'?'sf':'ext';
  return '<span class="org '+c+'">'+esc(o||'External')+'</span>';
}
function initials(n){return String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(function(w){return w.charAt(0).toUpperCase();}).join('');}
function commsInner(){
  var C=DATA.comms; if(!C) return '';
  var teams=state.ctab==='teams', h='';
  var items=(teams?(C.chat||[]):(C.emails||[])).slice().sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});
  h+='<div class="ctabs" role="tablist" aria-label="Communication channels">'+
    '<button type="button" role="tab" class="ctab" data-ctab="teams" aria-selected="'+teams+'">Microsoft Teams</button>'+
    '<button type="button" role="tab" class="ctab" data-ctab="outlook" aria-selected="'+!teams+'">Microsoft Outlook</button></div>';
  h+='<div class="snapwrap"><div class="snapwin cwin" tabindex="0" role="region" aria-label="'+(teams?'Teams messages':'Outlook messages')+', scrollable list">';
  if(!items.length) h+='<p class="nomt">No recent communications.</p>';
  else if(teams) h+='<ul class="feed">'+items.map(function(m){
    return '<li class="msg"><span class="av" aria-hidden="true">'+esc(initials(m.from))+'</span><div class="mb"><div class="mh"><b>'+esc(m.from)+'</b> '+orgTag(m.org)+'<span class="mw">'+esc(shortTime(m.at))+'</span></div><div class="mx">'+esc(m.text)+'</div></div></li>';}).join('')+'</ul>';
  else{
    state._mails=items;
    h+='<ul class="feed">'+items.map(function(m,i){
      var open=!!state.mailOpen[m.subject], msgs=(m.msgs||[]).slice().sort(function(a,b){return a.at<b.at?1:a.at>b.at?-1:0;});
      var li='<li class="mail"><button type="button" class="mrow" data-mail="'+i+'" aria-expanded="'+open+'"><span class="mcar" aria-hidden="true">&#9656;</span><span class="mmain"><span class="ms">'+esc(m.subject)+'</span><span class="mh">Latest from <b>'+esc(m.from)+'</b> '+orgTag(m.org)+'<span class="mw">'+esc(shortTime(m.at))+'</span></span></span><span class="mcount">'+msgs.length+' message'+(msgs.length===1?'':'s')+'</span></button>';
      if(open){
        li+='<div class="chain">'+msgs.map(function(x){
          return '<div class="cm"><div class="mh"><b>'+esc(x.from)+'</b> '+orgTag(x.org)+'<span class="mw">'+esc(shortTime(x.at))+'</span>'+(x.p?'<span class="prev">Preview</span>':'')+'</div><div class="ct">'+esc(x.text)+'</div></div>';}).join('')+
          (m.note?'<p class="cnote">'+esc(m.note)+'</p>':'')+'</div>';
      }
      return li+'</li>';}).join('')+'</ul>';
  }
  h+='</div><span class="hint" aria-hidden="true">Scroll for more &#9662;</span></div>';
  return h;
}
function bindScroll(root){
  var win=root.querySelector('.snapwin'), wrap=root.querySelector('.snapwrap'); if(!win||!wrap) return;
  function chk(){wrap.classList.toggle('end',win.scrollTop+win.clientHeight>=win.scrollHeight-4);}
  win.addEventListener('scroll',chk); chk();
}
function renderComms(){
  var el=$('comms'); if(!el) return;
  var ow=el.querySelector('.snapwin'), st=ow?ow.scrollTop:0;
  el.querySelector('.cbody').innerHTML=commsInner();
  var nw=el.querySelector('.snapwin'); if(nw&&st) nw.scrollTop=st;
  bindScroll(el);
}
function commsHtml(){
  if(!DATA.comms) return '';
  return '<section class="comms" id="comms"><div class="snaphead"><h2>Project Communication</h2><p class="lead">Latest Messages from Project Channels</p></div><div class="cbody">'+commsInner()+'</div></section>';
}
function renderHome(){
  var phases=sortedPhases(), counts={};
  phases.forEach(function(p){counts[p.status]=(counts[p.status]||0)+1;});
  var done=counts.CP||0;
  var h='<section class="home"><div class="snap"><div class="snaphead"><h1>Implementation Snapshot</h1>'+
    '<p class="lead"><b>'+done+' of '+phases.length+'</b> phases completed</p></div>';
  h+='<div class="pbar" role="img" aria-label="Phase status overview">'+phases.map(function(p){
    var s=STATUS[p.status];return '<span title="'+esc(clean(p.name)+' - '+(s?s.label:NP))+'" style="background:'+(s?s.color:'#616265')+'"></span>';}).join('')+'</div>';
  h+='<div class="sumrow">'+Object.keys(counts).sort(function(a,b){return (STATUS[a]?STATUS[a].order:99)-(STATUS[b]?STATUS[b].order:99);}).map(function(k){
    var s=STATUS[k];return '<span class="pill" style="--c:'+(s?s.color:'#616265')+';background:'+rgba(s?s.color:'#616265',.16)+'">'+esc(s?s.label:NP)+' <b>'+counts[k]+'</b></span>';}).join('')+
    '<span class="scrollnote">Scroll the list to see all '+phases.length+' phases</span></div>';
  h+='<div class="snapwrap"><div class="snapwin" tabindex="0" role="region" aria-label="Implementation phases, scrollable list"><div class="grid">'+phases.map(function(p,i){
    var rows=flat(p.tasks), n=rows.length;
    var c=rows.filter(function(r){return r.status==='CP';}).length, x=rows.filter(function(r){return r.status==='CX';}).length, o=rows.filter(function(r){return OPEN[r.status];}).length;
    var line='<b>'+c+'</b> of '+n+' items completed'+(x?' &middot; '+x+' closed':'')+(o?' &middot; '+o+' open':'');
    return '<button type="button" class="card" data-goto="'+i+'"><span class="ch"><span class="cn">'+esc(clean(p.name))+'</span>'+
      (p.status?pill(p.status):'<span class="np">'+NP+'</span>')+'</span><span class="cl">'+line+'</span><span class="go">View tasks &rsaquo;</span></button>';
  }).join('')+'</div></div><span class="hint" aria-hidden="true">Scroll for more &#9662;</span></div></div>'+meetingsHtml()+commsHtml()+'</section>';
  $('toolbar').innerHTML='';$('chips').innerHTML='';$('tableHost').innerHTML=h;
  var win=document.querySelector('.snapwin'), wrap=document.querySelector('.snapwrap');
  function chk(){wrap.classList.toggle('end',win.scrollTop+win.clientHeight>=win.scrollHeight-4);}
  win.addEventListener('scroll',chk); chk();
  var ce=$('comms'); if(ce) bindScroll(ce);

function render(){
  if(state.tab!=='home') state.last=state.tab;
  renderTabs();
  if(state.tab==='home') renderHome();
  else{renderToolbar();renderTable();}
  renderFooter();
}

/* ---------- Project Health ---------- */
function setHealth(v,save){
  $('health').value=v;
  var d=$('healthDot'); d.className='dot'+(v==='On Track'?' on':v==='At Risk'?' risk':v==='Off Track'?' off':'');
  if(save){try{localStorage.setItem('sf-portal-health',v);}catch(e){}}
}

/* ---------- Refresh panel (press R) ---------- */
var pending=null;
function dataBlock(obj){
  return '<!-- WRIKE-DATA-START -->\n<script type="application/json" id="wrike-data">'+JSON.stringify(obj).replace(/</g,'\\u003c')+'<\/script>\n<!-- WRIKE-DATA-END -->';
}
function copyText(text){
  if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function(res,rej){
    var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej(new Error('copy blocked'));}catch(e){rej(e);}
    document.body.removeChild(ta);
  });
}
function say(id,text,err){var m=$(id);if(m){m.textContent=text;m.className='msg'+(err?' err':'');}}
function openRefresh(){
  pending=null;
  $('dlg').innerHTML=
   '<h2 id="ovTitle">Refresh Wrike data</h2>'+
   '<p>This page cannot read Wrike on its own. The pull happens in Claude, and the page then takes the new data block.</p>'+
   '<div class="stp">1. Ask Claude for a fresh pull</div>'+
   '<div class="acts"><button type="button" class="btn primary" data-act="copyreq">Copy refresh request</button></div>'+
   '<p>Paste it into Claude. Claude pulls Wrike and replies with the updated file.</p><div class="msg" id="m1"></div>'+
   '<div class="stp">2. Preview the new data (optional)</div>'+
   '<p>Paste the data block from Claude here. It stays in this browser tab only.</p>'+
   '<textarea id="pasteBox" spellcheck="false" placeholder="Paste the new WRIKE-DATA block (JSON) here"></textarea>'+
   '<div class="acts"><button type="button" class="btn" data-act="apply">Preview this data</button></div><div class="msg" id="m2"></div>'+
   '<div class="stp">3. Copy the updated file for GitHub</div>'+
   '<p>Builds this page&rsquo;s file with only the data block replaced, ready to paste into GitHub.</p>'+
   '<div class="acts"><button type="button" class="btn primary" data-act="copyfile">Copy updated file</button>'+
   '<button type="button" class="btn" data-act="copyblock">Copy data block only</button>'+
   '<span class="spacer"></span><button type="button" class="btn" data-act="close">Close <span class="kbd">Esc</span></button></div>'+
   '<div class="msg" id="m3"></div>'+
   '<textarea id="outBox" spellcheck="false" readonly style="display:none" aria-label="Updated file text"></textarea>';
  $('ov').classList.add('open');
  var b=$('dlg').querySelector('button');if(b)b.focus();
}
function closeRefresh(){$('ov').classList.remove('open');}
function parsePasted(){
  var t=($('pasteBox').value||'').trim();
  if(!t) throw new Error('Paste a data block first.');
  var m=/<script[^>]*>([\s\S]*?)<\/script>/i.exec(t); if(m) t=m[1].trim();
  var obj=JSON.parse(t);
  if(!obj||!Array.isArray(obj.impl)||!Array.isArray(obj.launch)||!obj.people||!obj.meta) throw new Error('That block is missing impl, launch, people or meta.');
  return obj;
}
function showOut(text,okMsg,failMsg,id){
  var box=$('outBox');box.value=text;box.style.display='block';
  copyText(text).then(function(){say(id,okMsg);},function(){box.focus();box.select();say(id,failMsg,true);});
}
function currentObj(){return pending||DATA;}
function doAct(act){
  if(act==='refresh') return openRefresh();
  if(act==='close') return closeRefresh();
  if(act==='expand'){sortedPhases().forEach(function(p){state.expanded[p.name]=true;});return render();}
  if(act==='collapse'){state.expanded={};return render();}
  if(act==='copyreq'){
    return copyText(REFRESH_REQUEST).then(function(){say('m1','Copied. Paste it into Claude.');},function(){say('m1','Copy was blocked here. Select and copy this text: '+REFRESH_REQUEST,true);});
  }
  if(act==='apply'){
    try{
      var obj=parsePasted(); pending=obj; DATA=obj; model=buildModel(DATA);
      state.status='';state.assignee='';render();
      say('m2','Previewing the pasted data (not saved). Pulled '+fmtDay(obj.meta.pulledAt)+'.');
    }catch(e){say('m2',e.message||'Could not read that block.',true);}
    return;
  }
  if(act==='copyblock'){
    try{if($('pasteBox').value.trim()) pending=parsePasted();}catch(e){return say('m3',e.message,true);}
    return showOut(dataBlock(currentObj()),'Data block copied.','Copy was blocked here. The text is selected below, press Ctrl/Cmd+C.','m3');
  }
  if(act==='copyfile'){
    try{if($('pasteBox').value.trim()) pending=parsePasted();}catch(e){return say('m3',e.message,true);}
    say('m3','Building the file...');
    return fetch(location.href.split('#')[0],{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);return r.text();
    }).then(function(src){
      var re=/<!-- WRIKE-DATA-START -->[\s\S]*?<!-- WRIKE-DATA-END -->/;
      if(!re.test(src)) throw new Error('markers not found');
      var out=src.replace(re,function(){return dataBlock(currentObj());});
      showOut(out,'Updated file copied ('+Math.round(out.length/1024)+' KB). Paste it over the file on GitHub.','Copy was blocked here. The file text is selected below, press Ctrl/Cmd+C.','m3');
    }).catch(function(){
      say('m3','This page could not read its own source here (this happens when opened from a local file). Use "Copy data block only" and replace the block between WRIKE-DATA-START and WRIKE-DATA-END.',true);
    });
  }
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var wasOpen=state.menu;
  if(!e.target.closest('.tabwrap')) state.menu=false;
  var t=e.target.closest('[data-mail],[data-ctab],[data-tab],[data-menu],[data-view],[data-mode],[data-sort],[data-chip],[data-phase],[data-act],[data-goto]');
  if(!t){ if(wasOpen&&!state.menu) renderTabs(); return; }
  if(t.hasAttribute('data-mail')){ var mm=state._mails[+t.getAttribute('data-mail')]; if(mm){ state.mailOpen[mm.subject]=!state.mailOpen[mm.subject]; } return renderComms(); }
  if(t.hasAttribute('data-ctab')){ state.ctab=t.getAttribute('data-ctab'); return renderComms(); }
  if(t.hasAttribute('data-menu')){ state.menu=!wasOpen; return renderTabs(); }
  if(t.hasAttribute('data-view')){
    state.menu=false;state.tab=t.getAttribute('data-view');state.status='';state.assignee='';state.sort={key:'title',dir:1};
    try{history.replaceState(null,'','#'+state.tab);}catch(x){}
    return render();
  }
  if(wasOpen&&!state.menu) renderTabs();
  if(t.hasAttribute('data-goto')){
    var gi=+t.getAttribute('data-goto');
    state.tab='schedule';state.status='';state.assignee='';state.expanded={};state.expanded[sortedPhases()[gi].name]=true;state.sort={key:'title',dir:1};
    try{history.replaceState(null,'','#schedule');}catch(x){}
    render();
    var el=document.querySelector('.phtoggle[data-phase="'+gi+'"]');
    if(el) el.scrollIntoView({block:'start'});
    return;
  }
  if(t.hasAttribute('data-tab')){
    var tv=t.getAttribute('data-tab');
    state.tab=tv;state.status='';state.assignee='';
    state.sort={key:'title',dir:1};
    try{history.replaceState(null,'','#'+state.tab);}catch(x){}
    return render();
  }
  if(t.hasAttribute('data-mode')){state.mode=t.getAttribute('data-mode');
    var ok=statusesPresent().some(function(s){return s.code===state.status;});if(!ok) state.status='';
    return render();}
  if(t.hasAttribute('data-sort')){var k=t.getAttribute('data-sort');
    state.sort=(state.sort.key===k)?{key:k,dir:-state.sort.dir}:{key:k,dir:1};return renderTable(),renderToolbar();}
  if(t.hasAttribute('data-chip')){var c=t.getAttribute('data-chip');state.status=(state.status===c)?'':c;return render();}
  if(t.hasAttribute('data-phase')){var p=state._phases[+t.getAttribute('data-phase')];
    state.expanded[p.name]=!state.expanded[p.name];return render();}
  if(t.hasAttribute('data-act')) return doAct(t.getAttribute('data-act'));
});
document.addEventListener('change',function(e){
  if(e.target.id==='fStatus'){state.status=e.target.value;render();}
  else if(e.target.id==='fAssignee'){state.assignee=e.target.value;render();}
  else if(e.target.id==='health'){setHealth(e.target.value,true);}
});
$('ov').addEventListener('click',function(e){if(e.target===$('ov')) closeRefresh();});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeRefresh();if(state.menu){state.menu=false;renderTabs();}return;}
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  var t=e.target, tag=t&&t.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable)) return;
  if(e.key==='r'||e.key==='R'){e.preventDefault();openRefresh();}
});
window.addEventListener('hashchange',function(){
  var h=location.hash.replace('#','');
  if((h==='home'||h==='launch'||h==='schedule')&&h!==state.tab){state.tab=h;state.status='';state.assignee='';state.sort={key:'title',dir:1};render();}
});

/* ---------- Boot ---------- */
try{
  DATA=JSON.parse($('wrike-data').textContent);
  model=buildModel(DATA);
  $('clientName').textContent=DATA.meta.client||'Seaboard Foods';
  var h0=location.hash.replace('#','');
  if(h0==='home'||h0==='launch'||h0==='schedule') state.tab=h0;
  var saved='';try{saved=localStorage.getItem('sf-portal-health')||'';}catch(e){}
  setHealth(DATA.meta.health||saved||'',false);
  render();
}catch(err){
  $('tableHost').innerHTML='<div class="empty">The data block could not be read. Check the WRIKE-DATA block.</div>';
}
})();
</script>
</body>
</html>
